<ion-item lines="full">
  <span slot="start" style="font-weight: bold; color: #6b6b6b;">Nueva venta</span>
  <ion-searchbar class="Buscar" [(ngModel)]="binding" color="light" slot="end"></ion-searchbar>
  <ion-button slot="end" (click)="Add(binding)">
    Agregar producto
  </ion-button>
</ion-item>
<div *ngIf="!add" style="   
 display: flex;
    position: absolute;
    align-items: center;
    justify-content: space-evenly;
    width: 100%;
    height: 100%;">
  <div style="width: 77svh; height: 60svh;">
      <ion-img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3D6kIHeWCURP8WUMYAmU79sSYTLlEyfoEiA&s"></ion-img>
  </div>
 
</div>
<div *ngIf="add">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-sm="2.5" *ngFor="let p of Productos; let i= index">
        <ion-card>
          <ion-card-header>
            <label>{{p.categoria}}</label>
          </ion-card-header>
          <div style="display: flex; justify-content: center; align-items: center;">
            <ion-icon name="basket-outline" style="font-size: 6em; color: #117e80;"></ion-icon>
          </div>
          <ion-card-content>
            <div>
              <ion-grid>
                <ion-row>
                  <ion-col size="auto"> <span>{{p.nombre}}</span></ion-col>
                  <ion-col size="auto">
                    <div style="width: 59px"><span class="PTex">Cant:&nbsp;{{p.cantidad}}&nbsp;
                        Cod:&nbsp;{{p.codigo}}</span></div>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </div>
            <div class="button-group">
              <span>{{p.precio | currency:'USD':'symbol':'1.2-2'}}</span>

              <ion-button fill="clear" (click)="rest(i)">
                <ion-icon name="remove-circle-outline"></ion-icon>
              </ion-button>

              <ion-button fill="clear" (click)="deleatePro(i,p.codigo)">
                <ion-icon name="trash"></ion-icon>
              </ion-button>

            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>

    </ion-row>
  </ion-grid>

</div>
<div class="Total">

  <ion-label class="Monto">Total:&nbsp;{{ Total|
    currency:'USD':'symbol':'1.2-2'}}</ion-label>
  <ion-button id="open-modal" expand="block" fill="clear" shape="round">
    Cobrar
  </ion-button>

</div>


<ion-modal #modal trigger="open-modal">
  <ng-template>
    <ion-content>
      <ion-toolbar>
        <ion-title>Metodo de pago &nbsp;<ion-icon name="card-outline"></ion-icon></ion-title>
        <ion-buttons slot="end">
          <ion-button color="light" (click)="modal.dismiss()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
      <ion-list>
        <ion-item>
          <ion-checkbox labelPlacement="end" justify="start"><b>Pago en Efectivo</b></ion-checkbox>
        </ion-item>
        <ion-item>
          <ion-checkbox labelPlacement="end" justify="start"><b>Pago con Targeta</b></ion-checkbox>
        </ion-item>
        <ion-item>
          <ion-checkbox labelPlacement="end" justify="start"><b>Transferencia</b></ion-checkbox>
        </ion-item>

      </ion-list>
      <ion-button (click)="Venta()" expand="block" shape="round">
        Finalizar cobro
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
